<header class="site-header">
  <a class="brand" routerLink="/" aria-label="HPS Technologies home">
    <img [src]="logo" alt="HPS Technologies" />
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    @for (item of navItems; track item.path) {
      <div class="nav-item" [class.has-children]="item.children?.length">
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          {{ item.label }}
        </a>

        @if (item.children?.length) {
          <div class="dropdown">
            @for (child of item.children; track child.path) {
              <a [routerLink]="child.path">{{ child.label }}</a>
            }
          </div>
        }
      </div>
    }
  </nav>
</header>
