<section class="strengths">
  <div class="section-inner strength-grid">
    @for (item of highlights; track item.title) {
      <article>
        <img [src]="item.image" [alt]="item.title" />
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </article>
    }
  </div>
</section>
